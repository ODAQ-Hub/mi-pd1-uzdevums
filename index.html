
<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani uzdevumi</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Mani uzdevumi</h1>

        <div class="input-group">
            <input
                type="text"
                id="task-input"
                placeholder="Jauns uzdevums..."
                autocomplete="off"
            >
            <div class="date-field">
                <input
                    type="date"
                    id="task-date"
                    lang="en-US"
                    min="0001-01-01"
                    max="9999-12-31"
                    aria-label="Uzdevuma termiņš"
                    aria-describedby="date-format"
                >
                <small id="date-format">Termiņš: mm/dd/gggg</small>
                <output id="selected-date" for="task-date"></output>
            </div>
            <button id="add-btn">Pievienot</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Visi</button>
            <button class="filter-btn" data-filter="active">Aktīvie</button>
            <button class="filter-btn" data-filter="done">Izpildītie</button>
        </div>

        <ul id="task-list"></ul>

        <p class="counter">
            Atlikuši <span id="counter">0</span> uzdevumi
        </p>
    </main>
</body>
</html>
